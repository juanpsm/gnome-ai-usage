name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip

      - name: Build .plasmoid
        run: make pack

      - name: Build GNOME Shell extension archives
        run: make gnome-pack

      - name: Get version and artifact paths
        id: info
        run: |
          # Resolve the built files rather than rebuilding their names from the
          # tag: pack derives the version from package/metadata.json, which only
          # matches the tag when the release went through tag.sh.
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="$(ls -1 ./*.plasmoid | head -1)"
          GNOME_ARTIFACT="$(ls -1 ./*-modern.shell-extension.zip | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=$(basename "$ARTIFACT")" >> "$GITHUB_OUTPUT"
          echo "gnome_artifact=$(basename "$GNOME_ARTIFACT")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p')"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
            NOTES="$(git log --pretty=format:'- %s' --no-merges)"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.info.outputs.version }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ---
            ### KDE Plasma
            Download the `.plasmoid` file and run:
            ```
            plasmapkg2 -i ${{ steps.info.outputs.artifact }}
            ```

            ### GNOME Shell
            Download the archive for your shell — `modern` for GNOME 45+,
            `legacy` for GNOME 42–44 (`gnome-shell --version`) — then run:
            ```
            gnome-extensions install --force ${{ steps.info.outputs.gnome_artifact }}
            gnome-extensions enable ai-usage@juanpsm
            ```
            Log out and back in (or press Alt+F2, `r`, Enter on X11) to load it.
          files: |
            *.plasmoid
            *.shell-extension.zip
