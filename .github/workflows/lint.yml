name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check package/contents/tools/aiusage"

      - name: ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check package/contents/tools/aiusage"

      - name: provider contract tests
        run: ./tests/get-ai-usage.test.sh

      - name: terminal frontend tests
        run: ./tests/ai-usage-cli.test.sh

      - name: codex helper tests
        run: |
          ./tests/get-codex-stats.test.sh
          ./tests/get-codex-rate-limits.test.sh

      - name: shared frontend code tests
        run: node --test tests/*.test.js
